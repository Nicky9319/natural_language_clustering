name: Build and publish backend image

# Detects changes in the backend code, builds a Docker image, and pushes it
# to GitHub Container Registry (GHCR) as `natural_language_clustering_backend`.
#
# Versioning rules:
#   1. workflow_dispatch `version` input (if provided) -> validated as semver
#   2. Pushed git tag matching vX.Y.Z -> use the tag
#   3. Otherwise -> fetch latest semver tag from GHCR and increment patch
#   4. No package / no semver tags -> start at 0.0.0
#
# Tags pushed: <version> and sha-<7-char-sha>. No `latest` tag.

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional release version in Major.Minor.Patch format (e.g. 1.2.3). Leave empty to auto-increment patch.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-docker-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/nicky9319/natural_language_clustering/natural_language_clustering_backend
  PACKAGE_NAME: natural_language_clustering_backend

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine image version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          version=''

          # 1. Manual override from workflow_dispatch
          if [[ -n "${MANUAL_VERSION:-}" ]]; then
            if [[ ! "$MANUAL_VERSION" =~ $semver_re ]]; then
              echo "::error title=Invalid manual version::Version '$MANUAL_VERSION' must use strict Major.Minor.Patch format (e.g. 1.2.3)."
              exit 1
            fi
            version="$MANUAL_VERSION"
            echo "Using manually supplied version: $version"

          # 2. Triggered by a vX.Y.Z tag
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" =~ $tag_re ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "Using version from Git tag: $version"

          # 3. Auto: look up the latest semver tag in GHCR
          else
            api_url="https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER:-${{ github.repository_owner }}}/${GITHUB_REPOSITORY##*/}/packages/container/${PACKAGE_NAME}/versions?per_page=100"
            response_file="${RUNNER_TEMP}/ghcr-versions.json"

            http_status="$(
              curl -sS -L \
                --retry 3 --retry-all-errors --retry-delay 2 \
                --connect-timeout 10 --max-time 60 \
                -o "$response_file" -w '%{http_code}' \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$api_url"
            )"

            case "$http_status" in
              404)
                version='0.0.0'
                echo "Package not found in GHCR; starting at $version."
                ;;

              200)
                if [[ "$(jq 'type' "$response_file")" != '"array"' ]]; then
                  echo "::error title=Unexpected GHCR response::Expected JSON array from the package versions API."
                  jq -c . "$response_file" 2>/dev/null || cat "$response_file" || true
                  exit 1
                fi

                semver_tags="$(
                  jq -c '
                    [ .[] | (.metadata.container.tags // [])[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) ]
                  ' "$response_file"
                )"

                if [[ "$(jq 'length' <<<"$semver_tags")" -eq 0 ]]; then
                  version='0.0.0'
                  echo "No valid semver tags found on the package; starting at $version."
                else
                  latest="$(jq -r 'max_by(split(".") | map(tonumber))' <<<"$semver_tags")"
                  IFS='.' read -r major minor patch <<<"$latest"
                  # 10#$patch avoids octal interpretation if patch ever has a leading zero.
                  version="${major}.${minor}.$((10#$patch + 1))"
                  echo "Latest semver tag is $latest; next version is $version."
                fi
                ;;

              *)
                echo "::error title=GHCR API request failed::HTTP $http_status"
                jq -c . "$response_file" 2>/dev/null || cat "$response_file" || true
                exit 1
                ;;
            esac
          fi

          short_sha="${GITHUB_SHA:0:7}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

          echo "Resolved image tags:"
          echo "  ${IMAGE_NAME}:${version}"
          echo "  ${IMAGE_NAME}:sha-${short_sha}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.version.outputs.short_sha }}
          build-args: |
            PRELOAD_MODEL=false
            EMBEDDING_MODEL=BAAI/bge-m3
          cache-from: type=gha,scope=backend-docker
          cache-to: type=gha,mode=max,scope=backend-docker
          provenance: false

      - name: Summarize published image
        if: success()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          {
            echo "### Backend image published"
            echo
            echo "- Image: \`${IMAGE_NAME}:${VERSION}\`"
            echo "- SHA tag: \`${IMAGE_NAME}:sha-${SHORT_SHA}\`"
            echo "- Source commit: \`${SHORT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
